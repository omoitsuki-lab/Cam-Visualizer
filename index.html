<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <title>Piston & Cam with Tuning UI (Bi-Directional)</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            background: #0f1115;
            color: #ddd;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Sans", "Noto Sans JP", Helvetica, Arial, sans-serif;
            display: grid;
            grid-template-columns: 1fr 4fr;
            grid-template-rows: auto 1fr;
            height: 100vh;
            overflow: hidden;
        }

        .panel {
            padding: 16px;
            border-right: 1px solid #222;
            overflow-y: auto;
            min-width: 200px;
        }

        header {
            grid-column: 1 / -1;
            padding: 4px 16px;
            border-bottom: 1px solid #222;
        }

        .group {
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #222;
        }

        .group h3 {
            margin: 0 0 8px;
            font-size: 14px;
            color: #9db3ff;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 36px;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }

        label {
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
        }

        .value {
            font-variant-numeric: tabular-nums;
            text-align: right;
            color: #aaa;
            font-size: 12px;
        }

        .canvas {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 35px;
            background: radial-gradient(1200px 600px at 60% 40%, #0c1018 0%, #0b0e14 40%, #0a0d13 100%);
            overflow-y: auto;
        }

        #valveStatusOverlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
        }

        #valveStatus {
            font-size: clamp(11px, 1.5vw, 16px);
            font-weight: 700;
            padding: 4px 10px;
            background: rgba(15, 17, 21, 0.7);
            border: 1px solid #444;
            border-radius: 6px;
            color: #aaa;
            text-align: center;
            min-width: 100px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        #valveGraph text {
            font-family: sans-serif;
            font-weight: 800;
            paint-order: stroke;
            stroke: #0f1115;
            stroke-width: 4px;
            font-size: 11px;
        }

        svg {
            width: 98%;
            height: 98%;
            max-width: 1400px;
            max-height: 90vh;
        }

        .label {
            font: 15px sans-serif;
            fill: #bfc7d9;
        }

        .metal {
            fill: #8b8f99;
            stroke: #b7becb;
            stroke-width: 2;
        }

        .red {
            fill: #e45b5b;
        }

        .blue {
            fill: #4aa3ff;
        }

        .green {
            fill: #6be28f;
        }

        .overlay {
            fill: none;
            stroke: #999;
            stroke-width: 1.5;
            stroke-dasharray: 4 4;
        }

        .spark {
            fill: #ffd059;
            stroke: #ffefaf;
            stroke-width: 1.5;
            filter: url(#glow);
        }

        .camCross {
            stroke: #ffd700;
            stroke-width: 3;
        }

        .crankCross {
            stroke: #00ffff;
            stroke-width: 3;
        }

        .manual-control-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
        }

        .manual-control-buttons button {
            flex-grow: 1;
            padding: 8px 12px;
            background-color: #33394a;
            border: 1px solid #4a5168;
            color: #fff;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .manual-control-buttons button:hover {
            background-color: #4a5168;
        }

        .manual-control-buttons button:disabled {
            background-color: #1a1f29;
            color: #555;
            border-color: #222;
            cursor: not-allowed;
        }

        #jogDial {
            width: 100%;
            height: auto;
            max-width: 140px;
            cursor: grab;
            touch-action: none;
        }

        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
                grid-template-rows: auto 2fr 1fr;
            }

            .panel {
                grid-row: 3;
                border-right: none;
                border-top: 1px solid #222;
            }

            .canvas {
                grid-row: 2;
            }
        }

        /* --- 回転方向トグルスイッチのカスタムスタイル --- */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            background: #222;
            padding: 4px 10px;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 20px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4a5168;
            transition: .3s;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            box-sizing: border-box;
        }

        .slider::before {
            content: "CCW";
            position: absolute;
            right: 5px;
            font-size: 9px;
            font-weight: bold;
            color: #aaa;
            transition: .3s;
        }

        .slider::after {
            content: "";
            position: absolute;
            height: 14px;
            width: 24px;
            left: 3px;
            bottom: 3px;
            background-color: #4aa3ff;
            transition: .3s;
            border-radius: 7px;
        }

        .toggle-switch input:checked+.slider {
            background-color: #33394a;
        }

        .toggle-switch input:checked+.slider::before {
            content: "CW";
            left: 7px;
            right: auto;
            color: #ffd700;
        }

        .toggle-switch input:checked+.slider::after {
            transform: translateX(30px);
            background-color: #ffd700;
        }

        body.line-art-mode .switch-container {
            background: #fff !important;
            color: #000 !important;
            border: 1px solid #000;
        }

        body.line-art-mode .slider {
            background-color: #fff !important;
            border: 1px solid #000;
        }

        body.line-art-mode .slider::before {
            color: #000 !important;
        }

        body.line-art-mode .slider::after {
            background-color: #000 !important;
        }

        body.line-art-mode .toggle-switch input:checked+.slider {
            background-color: #fff !important;
        }

        /* 徹底線画モード */
        body.line-art-mode {
            background: #fff !important;
            color: #000 !important;
        }

        body.line-art-mode .panel {
            background: #fff !important;
            border-right: 2px solid #000 !important;
        }

        body.line-art-mode .group {
            border-bottom: 1px solid #000 !important;
        }

        body.line-art-mode .group h3 {
            color: #000 !important;
            border-bottom: 1px solid #000;
        }

        body.line-art-mode .canvas {
            background: #fff !important;
        }

        body.line-art-mode .value {
            color: #000 !important;
            font-weight: normal !important;
        }

        body.line-art-mode input[type="range"] {
            appearance: none;
            background: #fff !important;
            border: 1px solid #000 !important;
            height: 6px;
            border-radius: 3px;
        }

        body.line-art-mode input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            background: #fff !important;
            border: 2px solid #000 !important;
            border-radius: 50%;
        }

        body.line-art-mode input[type="checkbox"],
        body.line-art-mode select {
            background: #fff !important;
            color: #000 !important;
            border: 1px solid #000 !important;
        }

        body.line-art-mode input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 2px;
            position: relative;
            vertical-align: middle;
            cursor: pointer;
        }

        body.line-art-mode input[type="checkbox"]:checked::after {
            content: "✔";
            position: absolute;
            top: -3px;
            left: 1px;
            color: #000 !important;
            font-size: 12px;
        }

        body.line-art-mode button {
            background: #fff !important;
            color: #000 !important;
            border: 2px solid #000 !important;
        }

        body.line-art-mode .blue,
        body.line-art-mode .red,
        body.line-art-mode .green,
        body.line-art-mode .spark,
        body.line-art-mode .metal,
        body.line-art-mode #piston,
        body.line-art-mode #camPathExh,
        body.line-art-mode #camPathInt,
        body.line-art-mode rect[width="150"][height="260"],
        body.line-art-mode #jogDial circle,
        body.line-art-mode #crank circle {
            fill: #fff !important;
            stroke: #000 !important;
            stroke-width: 1.5px !important;
            filter: none !important;
        }

        body.line-art-mode #dialMarks rect {
            fill: #fff !important;
            stroke: #000 !important;
            stroke-width: 1px !important;
        }

        body.line-art-mode #rod {
            stroke: #fff !important;
            stroke-width: 8px !important;
            stroke-linecap: round;
            filter: drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) !important;
        }

        body.line-art-mode .camCross,
        body.line-art-mode .crankCross,
        body.line-art-mode #crankCrosshair line,
        body.line-art-mode .overlay,
        body.line-art-mode #currentPosLine {
            stroke: #000 !important;
            opacity: 1 !important;
        }

        body.line-art-mode .label {
            fill: #000 !important;
            font-weight: normal !important;
        }

        body.line-art-mode #currentPosLine {
            stroke-dasharray: 4 2 !important;
        }

        body.line-art-mode #graphContainer {
            background: transparent !important;
            border: 2px solid #000 !important;
        }

        body.line-art-mode #graphContainer div {
            color: #000 !important;
        }

        body.line-art-mode #graphExhPath,
        body.line-art-mode #graphIntPath {
            stroke: #000 !important;
            stroke-width: 2px !important;
        }

        body.line-art-mode #valveGraph line {
            stroke: #000 !important;
            opacity: 1 !important;
        }

        body.line-art-mode #valveGraph text,
        body.line-art-mode #lobeCenterEx text,
        body.line-art-mode #lobeCenterInt text,
        body.line-art-mode [id^="marker"] text {
            stroke: #fff !important;
            stroke-width: 2px !important;
            paint-order: stroke;
            fill: #000 !important;
            font-weight: normal !important;
        }

        body.line-art-mode .labels span {
            color: #000 !important;
            font-weight: normal !important;
            opacity: 1 !important;
        }

        body.line-art-mode #valveStatus {
            background: rgba(255, 255, 255, 0.8) !important;
            border: 2px solid #000 !important;
            color: #000 !important;
            box-shadow: none !important;
        }

        body.line-art-mode ::-webkit-scrollbar {
            width: 12px;
            background: #fff;
        }

        body.line-art-mode ::-webkit-scrollbar-thumb {
            background: #fff;
            border: 1px solid #000;
        }

        body.line-art-mode #fullscreenToggle {
            color: #000 !important;
        }

        body.line-art-mode #fullscreenIcon {
            fill: #000 !important;
        }

        .abbr-btn:hover {
            background: #3d4b75 !important;
        }

        body.line-art-mode .abbr-btn {
            background: #fff !important;
            color: #000 !important;
            border: 1px solid #000 !important;
        }
    </style>
</head>

<body>
    <header style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="title-text" style="font-weight: bold;">Piston & Cam Visualizer</div>
        </div>
        <div style="display:flex; align-items:center; gap:20px;">
            <div class="switch-container">
                <span>回転方向 (左/右):</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="rotationDirectionToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <label class="switch-container" style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
                <input id="printMode" type="checkbox" /> 線画モード
            </label>
            <button id="fullscreenToggle" class="switch-container"
                style="border: none !important; cursor: pointer; padding: 4px 8px; border-radius: 4px; display: flex; align-items: center;"
                title="全画面モード">
                <svg id="fullscreenIcon" viewBox="0 0 24 24" width="18" height="18" style="fill: currentColor;">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>
    </header>

    <div class="panel">
        <div class="group">
            <h3>回転数</h3>
            <div class="row">
                <label for="rpm">RPM（クランク回転数）</label>
                <span class="value" id="rpmVal">5 rpm</span>
            </div>
            <input id="rpm" type="range" min="0" max="200" step="5" value="5" />
        </div>

        <div class="group">
            <h3>手動クランク制御</h3>
            <div class="row">
                <label><input id="autoRotateToggle" type="checkbox" checked /> 自動回転を有効にする</label>
                <span class="value"></span>
            </div>
            <div class="row">
                <label for="crankAngle">クランク角度（ジョグダイヤル）</label>
                <span class="value" id="crankAngleVal">0 °</span>
            </div>
            <input id="crankAngle" type="range" min="0" max="720" step="1" value="0" style="display:none;" />

            <div style="display:flex; justify-content:center; margin: 15px 0;">
                <svg id="jogDial" width="180" height="180" viewBox="0 0 100 100" style="cursor: grab;">
                    <circle cx="50" cy="50" r="45" fill="#33394a" stroke="#4a5168" stroke-width="2" />
                    <g id="dialMarks" transform="translate(50, 50)">
                        <rect x="-2" y="-45" width="4" height="8" rx="1" fill="#7cbafc" />
                        <rect x="-3" y="-45" width="6" height="12" rx="2" fill="#ffd700" transform="rotate(90)" />
                        <rect x="-2" y="-45" width="4" height="8" rx="1" fill="#9db3ff" transform="rotate(180)" />
                        <rect x="-2" y="-45" width="4" height="8" rx="1" fill="#9db3ff" transform="rotate(270)" />
                    </g>
                </svg>
            </div>
            <div class="manual-control-buttons">
                <button id="crankAngleMinus10" disabled>－1°</button>
                <button id="crankAnglePlus10" disabled>＋1°</button>
            </div>
        </div>

        <div class="group">
            <h3>カム設定</h3>
            <div class="row">
                <label for="camGap">Cam間隔</label>
                <span class="value" id="camGapVal">150 px</span>
            </div>
            <input id="camGap" type="range" min="140" max="260" step="5" value="150" />
        </div>

        <div class="group">
            <h3>バルブ挟み角</h3>
            <div class="row">
                <label for="valveOverlap">挟み角度</label>
                <span class="value" id="valveOverlapVal">30 °</span>
            </div>
            <input id="valveOverlap" type="range" min="0" max="90" step="1" value="30" />
        </div>

        <div class="group">
            <h3>カム作用角</h3>
            <div class="row">
                <label>吸気カム作用角</label>
                <span class="value" id="intDurationVal">20 px</span>
            </div>
            <input type="range" id="intDuration" min="180" max="320" value="220">
            <div class="row">
                <label>排気カム作用角</label>
                <span class="value" id="exhDurationVal">20 px</span>
            </div>
            <input id="exhDuration" type="range" min="180" max="320" value="220" />
        </div>

        <div class="group">
            <h3>カム全体位相（クランク基準）</h3>
            <div class="row">
                <label for="camPhase">全体位相</label>
                <span class="value" id="camPhaseVal">0 °</span>
            </div>
            <input id="camPhase" type="range" min="-70" max="70" step="1" value="0" />
            <div class="manual-control-buttons">
                <button id="camPhaseMinus">－1°</button>
                <button id="camPhasePlus">＋1°</button>
            </div>
        </div>

        <div class="group">
            <h3>個別位相調整</h3>
            <div class="row">
                <label>吸気</label>
                <span class="value" id="intakeCamPhaseVal">0 °</span>
            </div>
            <div class="manual-control-buttons">
                <button id="intakeCamPhaseMinus">－1°</button>
                <button id="intakeCamPhasePlus">＋1°</button>
            </div>
            <div class="row">
                <label>排気</label>
                <span class="value" id="exhaustCamPhaseVal">0 °</span>
            </div>
            <div class="manual-control-buttons">
                <button id="exhaustCamPhaseMinus">－1°</button>
                <button id="exhaustCamPhasePlus">＋1°</button>
            </div>
        </div>

        <div class="group">
            <h3>点火時期</h3>
            <div class="row">
                <label for="ignAdv">点火進角</label>
                <span class="value" id="ignVal">0 °</span>
            </div>
            <input id="ignAdv" type="range" min="-130" max="130" step="1" value="0" />
            <div class="manual-control-buttons">
                <button id="ignAdvMinus">－1°</button>
                <button id="ignAdvPlus">＋1°</button>
            </div>
        </div>

        <div class="group">
            <h3>視覚補助</h3>
            <div class="row">
                <label><input id="showTDC" type="checkbox" checked /> TDC/BDC クランク カム センターラインを表示</label>
                <span class="value"></span>
            </div>
            <div class="row">
                <label><input id="showSpark" type="checkbox" checked /> 点火スパーク表示</label>
                <span class="value"></span>
            </div>
        </div>
    </div>

    <div class="canvas">
        <div id="valveStatusOverlay">
            <div id="valveStatus">ALL CLOSED</div>
        </div>

        <div id="graphContainer" style="position: absolute; top: 70%; left: 50%; transform: translateX(-50%); 
           width: 95%; max-width: 800px; 
           height: 15vw; min-height: 60px; max-height: 120px; 
           background: rgba(15, 17, 21, 0.8); border: 1px solid #333; 
           border-radius: 8px; pointer-events: none; z-index: 10;">

            <!-- 修正後: 背景色とボーダーを明るく調整したクラス・スタイルを適用 -->
            <div style="position: absolute; right: 10px; top: -32px; pointer-events: auto;">
                <label class="switch-container abbr-btn"
                    style="cursor: pointer; display: flex; align-items: center; gap: 6px; background: #2d3859; border: 1px solid #4a5168; color: #fff; font-weight: bold; transition: background 0.2s;">
                    <input id="useAbbrNotation" type="checkbox" style="cursor: pointer;"> BTDC/ATDC表記
                </label>
            </div>

            <svg id="valveGraph" width="100%" height="100%" viewBox="0 0 720 100" preserveAspectRatio="none"
                style="display: block; width: 100%;">
                <g id="graphFlipWrapper">
                    <line x1="0" y1="0" x2="0" y2="100" stroke="#444" stroke-width="1" />
                    <line x1="180" y1="0" x2="180" y2="100" stroke="#222" stroke-width="1" stroke-dasharray="4" />
                    <line x1="360" y1="0" x2="360" y2="100" stroke="#444" stroke-width="1" />
                    <line x1="540" y1="0" x2="540" y2="100" stroke="#222" stroke-width="1" stroke-dasharray="4" />
                    <line x1="720" y1="0" x2="720" y2="100" stroke="#444" stroke-width="1" />

                    <path id="graphExhPath" d="" fill="none" stroke="#e45b5b" stroke-width="2.5" opacity="0.8" />
                    <path id="graphIntPath" d="" fill="none" stroke="#4aa3ff" stroke-width="2.5" opacity="0.8" />

                    <line id="currentPosLine" x1="720" y1="0" x2="720" y2="100" stroke="#ffd700" stroke-width="2" />

                    <g id="lobeCenterEx">
                        <line x1="0" y1="0" x2="0" y2="100" stroke="#e45b5b" stroke-width="1" stroke-dasharray="2 4"
                            opacity="0.6" />
                        <text y="95" fill="#e45b5b" font-size="9" text-anchor="middle" font-weight="bold"></text>
                    </g>
                    <g id="lobeCenterInt">
                        <line x1="0" y1="0" x2="0" y2="100" stroke="#4aa3ff" stroke-width="1" stroke-dasharray="2 4"
                            opacity="0.6" />
                        <text y="95" fill="#4aa3ff" font-size="9" text-anchor="middle" font-weight="bold"></text>
                    </g>

                    <g id="markerExStart">
                        <line x1="0" y1="0" x2="0" y2="90" stroke="#e45b5b" stroke-dasharray="2 2" /><text y="15"
                            fill="#e45b5b" font-size="10" text-anchor="middle"></text>
                    </g>
                    <g id="markerExEnd">
                        <line x1="0" y1="0" x2="0" y2="90" stroke="#e45b5b" stroke-dasharray="2 2" /><text y="15"
                            fill="#e45b5b" font-size="10" text-anchor="middle"></text>
                    </g>
                    <g id="markerIntStart">
                        <line x1="0" y1="0" x2="0" y2="90" stroke="#4aa3ff" stroke-dasharray="2 2" /><text y="15"
                            fill="#4aa3ff" font-size="10" text-anchor="middle"></text>
                    </g>
                    <g id="markerIntEnd">
                        <line x1="0" y1="0" x2="0" y2="90" stroke="#4aa3ff" stroke-dasharray="2 2" /><text y="15"
                            fill="#4aa3ff" font-size="10" text-anchor="middle"></text>
                    </g>
                </g>
            </svg>

            <div id="graphLabels" class="labels"
                style="display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: #888;">
                <span id="lbl0">720°(TDC)</span><span id="lbl1">540°(BDC)</span><span id="lbl2">360°(TDC)</span><span
                    id="lbl3">180°(BDC)</span><span id="lbl4">0°(TDC)</span>
            </div>
        </div>

        <svg viewBox="0 0 900 520">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="b" />
                    <feMerge>
                        <feMergeNode in="b" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            <rect x="90" y="40" width="150" height="260" rx="12" ry="12" fill="#1a1f29" stroke="#333"
                stroke-width="3" />
            <line id="tdcLine" x1="50" y1="45" x2="270" y2="45" class="overlay" />
            <text x="275" y="45" dy="4" class="label" style="font-size:12px;">TDC</text>
            <line id="bdcLine" x1="50" y1="125" x2="270" y2="125" class="overlay" />
            <text x="275" y="125" dy="4" class="label" style="font-size:12px;">BDC</text>
            <line id="crankCenterLine" x1="50" y1="280" x2="270" y2="280" class="overlay" />
            <text x="275" y="280" dy="4" class="label" style="font-size:12px;">Fマーク</text>
            <line id="camCenterLine" x1="350" y1="120" x2="800" y2="120" class="overlay" />

            <line id="rod" x1="165" y1="300" x2="330" y2="300" stroke="#b7becb" stroke-width="10" />
            <rect id="piston" x="100" y="280" width="130" height="80" class="metal" />
            <g id="crank" transform="translate(165,280)">
                <circle r="60" class="metal" />
                <circle cx="0" cy="-42" r="10" class="blue" />
            </g>
            <g id="crankCrosshair">
                <line x1="-70" y1="0" x2="70" y2="0" class="crankCross" />
                <line x1="0" y1="-70" x2="0" y2="0" stroke="#ffd700" stroke-width="3" />
                <line x1="0" y1="0" x2="0" y2="70" class="crankCross" />
            </g>
            <g id="sparkGroup" transform="translate(165,40)" opacity="0">
                <polygon points="0,-10 4,-2 -4,-2" class="spark" />
                <circle r="20" class="spark" />
            </g>

            <g id="camAreaSystemGroup" transform="translate(550, 120)">
                <g id="exhLabelGroup" transform="translate(-70, 0)">
                    <text class="label" x="-30" y="-80">Exhaust Cam</text>
                    <circle id="exhValveLightCanvas" cx="-45" cy="-85" r="10" fill="#333" stroke="#5b2a2a"
                        stroke-width="1" />
                </g>
                <g id="exhGroup" transform="translate(-70, 0)">
                    <g id="camExh">
                        <path id="camPathExh" d="..." fill="#9aa3b3" stroke="#b7becb" stroke-width="2" />
                        <line x1="-40" y1="0" x2="40" y2="0" class="camCross" />
                        <line x1="0" y1="-55" x2="0" y2="40" class="camCross" />
                    </g>
                    <g id="exhValveAssembly">
                        <rect x="-30" y="35" width="60" height="18" class="metal" />
                        <rect x="-3" y="53" width="6" height="90" class="red" />
                        <rect x="-20" y="143" width="40" height="8" class="metal" />
                    </g>
                </g>

                <g id="intLabelGroup" transform="translate(70, 0)">
                    <text class="label" x="-30" y="-80">Intake Cam</text>
                    <circle id="intValveLightCanvas" cx="-45" cy="-85" r="10" fill="#333" stroke="#2a3f66"
                        stroke-width="1" />
                </g>
                <g id="intGroup" transform="translate(70, 0)">
                    <g id="camInt">
                        <path id="camPathInt" d="..." fill="#9aa3b3" stroke="#b7becb" stroke-width="2" />
                        <line x1="-40" y1="0" x2="40" y2="0" class="camCross" />
                        <line x1="0" y1="-55" x2="0" y2="40" class="camCross" />
                    </g>
                    <g id="intValveAssembly">
                        <rect x="-30" y="35" width="60" height="18" class="metal" />
                        <rect x="-3" y="53" width="6" height="90" class="blue" />
                        <rect x="-20" y="143" width="40" height="8" class="metal" />
                    </g>
                </g>
            </g>
        </svg>
    </div>

    <script>
        (function () {
            const el = id => document.getElementById(id);
            const camExh = el('camExh'), camInt = el('camInt'), camPathExh = el('camPathExh'), camPathInt = el('camPathInt');
            const exhValveAssembly = el('exhValveAssembly'), intValveAssembly = el('intValveAssembly');
            const piston = el('piston'), rod = el('rod'), crank = el('crank'), crankCrosshair = el('crankCrosshair');
            const jogDial = el('jogDial'), dialMarks = el('dialMarks'), rpmEl = el('rpm'), rpmVal = el('rpmVal'), ignAdvEl = el('ignAdv');
            const camPhaseEl = el('camPhase'), valveOverlapEl = el('valveOverlap'), camGapEl = el('camGap'), autoRotateToggleEl = el('autoRotateToggle');
            const intDurEl = el('intDuration'), exhDurEl = el('exhDuration');
            const valveStatusLabel = el('valveStatus');
            const currentPosLine = el('currentPosLine');
            const rotationDirEl = el('rotationDirection');
            const graphFlipWrapper = el('graphFlipWrapper');
            const camAreaSystemGroup = el('camAreaSystemGroup');

            const fsToggle = el('fullscreenToggle');
            const fsIcon = el('fullscreenIcon');

            const pathFullscreen = "M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z";
            const pathExitFullscreen = "M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z";

            fsToggle.onclick = function () {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.error(`全画面モードへの切り替えに失敗しました: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            };

            const updateFsButtonStyle = () => {
                const isLineArt = el('printMode').checked;
                const printModeLabel = el('printMode').parentElement;
                const abbrLabel = el('useAbbrNotation').parentElement;

                if (isLineArt) {
                    fsToggle.style.setProperty('background', '#fff', 'important');
                    fsToggle.style.setProperty('color', '#000', 'important');
                    fsToggle.style.border = "1px solid #000";

                    printModeLabel.style.setProperty('background', '#fff', 'important');
                    printModeLabel.style.setProperty('color', '#000', 'important');
                    printModeLabel.style.border = "1px solid #000";

                    abbrLabel.style.setProperty('background', '#fff', 'important');
                    abbrLabel.style.setProperty('color', '#000', 'important');
                    abbrLabel.style.border = "1px solid #000";
                } else {
                    fsToggle.style.background = "#333";
                    fsToggle.style.color = "#fff";
                    fsToggle.style.border = "none";

                    printModeLabel.style.background = "#333";
                    printModeLabel.style.color = "#fff";
                    printModeLabel.style.border = "none";

                    // 通常モード時の明るい背景色・ボーダーの復元
                    abbrLabel.style.background = "#2d3859";
                    abbrLabel.style.color = "#fff";
                    abbrLabel.style.border = "1px solid #4a5168";
                }
            };
            
            document.addEventListener('fullscreenchange', () => {
                const isLineArt = el('printMode').checked;
                if (document.fullscreenElement) {
                    fsIcon.querySelector('path').setAttribute('d', pathExitFullscreen);
                    fsToggle.title = "標準モード（元に戻す）";
                } else {
                    fsIcon.querySelector('path').setAttribute('d', pathFullscreen);
                    fsToggle.title = "全画面モード";
                }
                fsToggle.style.color = isLineArt ? "#000" : "#fff";
            });

            const originalPrintModeChange = el('printMode').onchange;
            el('printMode').onchange = function () {
                if (originalPrintModeChange) originalPrintModeChange.call(this);
                const isLineArt = this.checked;
                fsToggle.style.color = isLineArt ? "#000" : "#fff";
            };

            el('printMode').onchange = function () {
                if (this.checked) {
                    document.body.classList.add('line-art-mode');
                } else {
                    document.body.classList.remove('line-art-mode');
                }
            };

            const baseR = 32;
            const camRatio = 0.5;
            const CRANK_TDC_OFFSET = 90;
            const crankRadius = 42, rodLength = 150;

            let crankAngle = 0, last = performance.now(), isDragging = false, lastMouseAngle = 0;
            let intakeCamPhase = 0, exhaustCamPhase = 0;

            const toRad = deg => deg * Math.PI / 180;

            const getDirMode = () => el('rotationDirectionToggle').checked ? 'cw' : 'ccw';

            // --- 動的 BTDC/ATDC / BBDC/ABDC 判定ロジック ---
            function formatCrankAngle(angle) {
                const useAbbr = el('useAbbrNotation').checked;
                const a = ((angle % 720) + 720) % 720;
                if (!useAbbr) return `${a.toFixed(1).replace(/\.0$/, "")}°`;

                const cycleA = a % 360;
                if (cycleA === 0 || cycleA === 360) return "TDC";
                if (cycleA === 180) return "BDC";

                // TDC（0°または360°）および BDC（180°）からの距離を比較
                const distTDC = Math.min(cycleA, 360 - cycleA);
                const distBDC = Math.abs(cycleA - 180);

                if (distTDC < distBDC) {
                    // TDC基準 (0°〜90°未満, 270°超〜360°)
                    if (cycleA < 180) {
                        return `ATDC ${distTDC.toFixed(1).replace(/\.0$/, "")}°`;
                    } else {
                        return `BTDC ${distTDC.toFixed(1).replace(/\.0$/, "")}°`;
                    }
                } else {
                    // BDC基準 (90°〜270°)
                    if (cycleA < 180) {
                        return `BBDC ${distBDC.toFixed(1).replace(/\.0$/, "")}°`;
                    } else {
                        return `ABDC ${distBDC.toFixed(1).replace(/\.0$/, "")}°`;
                    }
                }
            }

            function calculateDynamicLift(durationDeg) {
                return 12 + Math.max(0, (durationDeg - 180) * 0.12);
            }

            function durationToTopR(lift, durationDeg) {
                const halfAngRad = toRad(durationDeg / 4);
                const cosA = Math.cos(halfAngRad);
                return Math.max(baseR * 0.1, (baseR - (baseR + lift) * cosA) / (1 - cosA));
            }

            function generateSmoothCamPath(lift, durationDeg) {
                const topR = durationToTopR(lift, durationDeg);
                const d = (baseR + lift) - topR;
                if (d <= 0 || isNaN(d)) return `M 0,-${baseR} A ${baseR} ${baseR} 0 1 1 0.01,-${baseR} Z`;
                const sinT = Math.max(-1, Math.min(1, (baseR - topR) / d));
                const cosT = Math.sqrt(1 - sinT * sinT);
                const x1 = baseR * cosT, y1 = -baseR * sinT;
                const x2 = topR * cosT, y2 = -d - (topR * sinT);
                return `M ${x1.toFixed(2)},${y1.toFixed(2)} A ${baseR} ${baseR} 0 1 1 ${(-x1).toFixed(2)},${y1.toFixed(2)} L ${(-x2).toFixed(2)},${y2.toFixed(2)} A ${topR} ${topR} 0 0 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
            }

            function getFlatFollowerLift(durationDeg, camRotationDeg) {
                const lift = calculateDynamicLift(durationDeg);
                const topR = durationToTopR(lift, durationDeg);
                const d = (baseR + lift) - topR;
                let ang = ((camRotationDeg % 360) + 540) % 360 - 180;
                const thetaRad = toRad(ang);
                const limitAngRad = toRad(durationDeg / 4);
                return Math.abs(thetaRad) < limitAngRad ? Math.max(0, d * Math.cos(thetaRad) + topR - baseR) : 0;
            }

            function updateDurLabel(open, close, lift, color, idSuffix) {
                const id = `durLabel_${idSuffix}`;
                let label = el(id);
                if (!label) {
                    label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    label.setAttribute("id", id);
                    label.setAttribute("fill", color); label.setAttribute("font-size", "11");
                    label.setAttribute("font-weight", "bold"); label.setAttribute("text-anchor", "middle");
                    el('valveGraph').appendChild(label);
                }
                if (open === -1) { label.textContent = ""; return; }
                const actualDur = ((close + 0.5) - (open - 0.5)).toFixed(1).replace(/\.0$/, "");

                let targetX = open + (close - open) / 2;
                if (getDirMode() === 'cw') {
                    targetX = 720 - targetX;
                }

                label.setAttribute("x", targetX);
                label.setAttribute("y", Math.max(10, 100 - (lift * 1.5) - 8));
                label.textContent = `${actualDur}°`;
            }

            function updateValveGraph() {
                let dInt = "", dExh = "";
                const overlap = parseFloat(valveOverlapEl.value), phaseAdj = parseFloat(camPhaseEl.value);
                const iDeg = parseFloat(intDurEl.value), eDeg = parseFloat(exhDurEl.value);
                let intOpen = -1, intClose = -1, exhOpen = -1, exhClose = -1;

                for (let i = 0; i <= 720; i += 0.5) {
                    const baseCam = (i * camRatio + (phaseAdj * camRatio) + 180);
                    const relExh = baseCam + (exhaustCamPhase * camRatio) + 135 - overlap / 2;
                    const relInt = baseCam + (intakeCamPhase * camRatio) - 135 + overlap / 2;
                    const lEx = getFlatFollowerLift(eDeg, relExh - (180 - overlap / 2));
                    const lIn = getFlatFollowerLift(iDeg, relInt - (180 + overlap / 2));

                    dExh += (i === 0 ? "M" : "L") + i + "," + (100 - lEx * 1.5);
                    dInt += (i === 0 ? "M" : "L") + i + "," + (100 - lIn * 1.5);
                    if (lIn > 0.000001) { if (intOpen === -1) intOpen = i; intClose = i; }
                    if (lEx > 0.000001) { if (exhOpen === -1) exhOpen = i; exhClose = i; }
                }
                el('graphExhPath').setAttribute('d', dExh);
                el('graphIntPath').setAttribute('d', dInt);

                if (getDirMode() === 'cw') {
                    graphFlipWrapper.setAttribute('transform', 'matrix(-1 0 0 1 720 0)');
                    el('graphLabels').innerHTML = `<span id="lbl0">0°(TDC)</span><span id="lbl1">180°(BDC)</span><span id="lbl2">360°(TDC)</span><span id="lbl3">540°(BDC)</span><span id="lbl4">720°(TDC)</span>`;
                } else {
                    graphFlipWrapper.removeAttribute('transform');
                    el('graphLabels').innerHTML = `<span id="lbl0">720°(TDC)</span><span id="lbl1">540°(BDC)</span><span id="lbl2">360°(TDC)</span><span id="lbl3">180°(BDC)</span><span id="lbl4">0°(TDC)</span>`;
                }

                const updateLobeCenter = (id, open, close, y) => {
                    const g = el(id);
                    if (open === -1 || close === -1) { g.setAttribute('display', 'none'); return; }
                    g.setAttribute('display', 'inline');
                    const center = (open + close) / 2;
                    g.querySelector('line').setAttribute('x1', center);
                    g.querySelector('line').setAttribute('x2', center);
                    const txt = g.querySelector('text');
                    txt.setAttribute('x', center);
                    txt.setAttribute('y', y);

                    if (getDirMode() === 'cw') {
                        txt.setAttribute('transform', `scale(-1, 1) translate(${-center * 2}, 0)`);
                    } else {
                        txt.removeAttribute('transform');
                    }

                    // --- LCのみTDC固定表記にする判定 ---
                    const useAbbr = el('useAbbrNotation').checked;
                    const a = ((720 - center) % 720 + 720) % 720; // クランク角度に変換

                    let lcStr = "";
                    if (!useAbbr) {
                        lcStr = `${a.toFixed(1).replace(/\.0$/, "")}°`;
                    } else {
                        const cycleA = a % 360; // 0〜360°（1サイクル）
                        if (cycleA === 0 || cycleA === 360) {
                            lcStr = "TDC";
                        } else if (cycleA < 180) {
                            // TDCより後（遅角側）
                            lcStr = `ATDC ${cycleA.toFixed(1).replace(/\.0$/, "")}°`;
                        } else {
                            // TDCより前（進角側）
                            const btdcVal = 360 - cycleA;
                            lcStr = `BTDC ${btdcVal.toFixed(1).replace(/\.0$/, "")}°`;
                        }
                    }

                    txt.textContent = `LC: ${lcStr}`;
                };

                updateLobeCenter('lobeCenterEx', exhOpen, exhClose, 95);
                updateLobeCenter('lobeCenterInt', intOpen, intClose, 95);

                const setMarker = (id, x, isStart, y) => {
                    const m = el(id); if (!m) return;
                    if (x === -1) { m.setAttribute('opacity', '0'); return; }
                    m.setAttribute('opacity', '1');
                    const cx = isStart ? (x - 0.5) : (x + 0.5);
                    m.querySelector('line').setAttribute('x1', cx); m.querySelector('line').setAttribute('x2', cx);
                    const txt = m.querySelector('text');
                    txt.setAttribute('x', cx);
                    txt.setAttribute('y', y);

                    if (getDirMode() === 'cw') {
                        txt.setAttribute('transform', `scale(-1, 1) translate(${-cx * 2}, 0)`);
                    } else {
                        txt.removeAttribute('transform');
                    }
                    txt.textContent = formatCrankAngle(720 - cx);
                };

                setMarker('markerExStart', exhOpen, true, 27); setMarker('markerExEnd', exhClose, false, 27);
                setMarker('markerIntStart', intOpen, true, 15); setMarker('markerIntEnd', intClose, false, 15);
                updateDurLabel(exhOpen, exhClose, calculateDynamicLift(eDeg), "#e45b5b", "exh");
                updateDurLabel(intOpen, intClose, calculateDynamicLift(iDeg), "#4aa3ff", "int");
            }

            function updateCamShapes() {
                const iDeg = parseFloat(intDurEl.value), eDeg = parseFloat(exhDurEl.value);
                camPathInt.setAttribute('d', generateSmoothCamPath(calculateDynamicLift(iDeg), iDeg));
                camPathExh.setAttribute('d', generateSmoothCamPath(calculateDynamicLift(eDeg), eDeg));
                updateLabels(); updateValveGraph();
            }

            function updateLabels() {
                const isCW = (getDirMode() === 'cw');
                const actualDisplayAngle = isCW ? crankAngle : (720 - crankAngle) % 720;

                rpmVal.textContent = `${rpmEl.value} rpm`; el('ignVal').textContent = `${ignAdvEl.value} °`;
                camPhaseEl.value = parseFloat(camPhaseEl.value);
                el('camPhaseVal').textContent = `${camPhaseEl.value} °`; el('valveOverlapVal').textContent = `${valveOverlapEl.value} °`;
                el('camGapVal').textContent = `${camGapEl.value} px`; el('intDurationVal').textContent = `${intDurEl.value} °`;
                el('exhDurationVal').textContent = `${exhDurEl.value} °`; el('intakeCamPhaseVal').textContent = `${intakeCamPhase} °`;
                el('exhaustCamPhaseVal').textContent = `${exhaustCamPhase} °`;
                el('crankAngleVal').textContent = `${Math.round(actualDisplayAngle)} °`;
            }

            function step(now) {
                const dt = (now - last) / 1000; last = now;
                const isCW = (getDirMode() === 'cw');

                if (autoRotateToggleEl.checked) {
                    const deltaAng = (parseFloat(rpmEl.value) * 720 / 60) * dt;
                    if (isCW) {
                        crankAngle = (crankAngle + deltaAng) % 720;
                    } else {
                        crankAngle = (crankAngle - deltaAng % 720 + 720) % 720;
                    }
                }
                const displayAngle = (720 - crankAngle) % 720;
                dialMarks.setAttribute('transform', `translate(50, 50) rotate(${crankAngle})`);

                const isTdcVisible = el('showTDC').checked;
                const displayStyle = isTdcVisible ? 'inline' : 'none';

                ['tdcLine', 'bdcLine', 'crankCenterLine'].forEach(id => {
                    const target = el(id);
                    if (target) {
                        target.style.display = displayStyle;
                        if (target.nextElementSibling && target.nextElementSibling.tagName === 'text') {
                            target.nextElementSibling.style.display = displayStyle;
                        }
                    }
                });

                if (el('camCenterLine')) el('camCenterLine').style.display = displayStyle;
                if (crankCrosshair) crankCrosshair.style.display = displayStyle;
                document.querySelectorAll('.camCross').forEach(line => {
                    line.style.display = displayStyle;
                });

                if (el('showSpark').checked) {
                    const sparkTriggerAngle = (parseFloat(ignAdvEl.value) + 720) % 720;
                    let diff = Math.abs(displayAngle - sparkTriggerAngle);
                    if (diff > 360) diff = 720 - diff;
                    el('sparkGroup').setAttribute('opacity', diff < 3 ? '1' : '0');
                } else {
                    el('sparkGroup').setAttribute('opacity', '0');
                }

                if (isCW) {
                    camAreaSystemGroup.setAttribute('transform', 'translate(550, 120) scale(-1, 1)');
                    el('exhLabelGroup').querySelector('text').setAttribute('transform', 'scale(-1, 1) translate(0, 0)');
                    el('exhLabelGroup').querySelector('circle').setAttribute('transform', 'scale(-1, 1) translate(0, 0)');
                    el('intLabelGroup').querySelector('text').setAttribute('transform', 'scale(-1, 1) translate(0, 0)');
                    el('intLabelGroup').querySelector('circle').setAttribute('transform', 'scale(-1, 1) translate(0, 0)');
                } else {
                    camAreaSystemGroup.setAttribute('transform', 'translate(550, 120)');
                    el('exhLabelGroup').querySelector('text').removeAttribute('transform');
                    el('exhLabelGroup').querySelector('circle').removeAttribute('transform');
                    el('intLabelGroup').querySelector('text').removeAttribute('transform');
                    el('intLabelGroup').querySelector('circle').removeAttribute('transform');
                }

                const rotSign = isCW ? -1 : 1;

                const graphX = isCW ? (720 - crankAngle) : crankAngle;
                currentPosLine.setAttribute('x1', graphX); currentPosLine.setAttribute('x2', graphX);

                const theta = toRad((crankAngle) % 360);
                const yP = 280 - (crankRadius * Math.cos(theta) + Math.sqrt(rodLength ** 2 - (crankRadius * Math.sin(theta)) ** 2));
                piston.setAttribute('y', yP - 40);
                rod.setAttribute('x1', 165); rod.setAttribute('y1', yP + 40);
                rod.setAttribute('x2', 165 + crankRadius * Math.sin(theta)); rod.setAttribute('y2', 280 - crankRadius * Math.cos(theta));
                crank.setAttribute('transform', `translate(165,280) rotate(${crankAngle})`);
                crankCrosshair.setAttribute('transform', `translate(165,280) rotate(${((crankAngle) % 360) + CRANK_TDC_OFFSET + parseFloat(ignAdvEl.value)})`);

                const gap = parseFloat(camGapEl.value), overlap = parseFloat(valveOverlapEl.value), phaseAdj = parseFloat(camPhaseEl.value);
                const baseCam = (crankAngle * camRatio + (phaseAdj * camRatio) + 180);

                el('exhGroup').setAttribute("transform", `translate(${-gap / 2}, 0)`);
                el('exhLabelGroup').setAttribute("transform", `translate(${-gap / 2}, 0)`);
                el('intGroup').setAttribute("transform", `translate(${gap / 2}, 0)`);
                el('intLabelGroup').setAttribute("transform", `translate(${gap / 2}, 0)`);

                const aEx = (baseCam + (exhaustCamPhase * camRatio) + rotSign * (135 - overlap / 2));
                const aIn = (baseCam + (intakeCamPhase * camRatio) - rotSign * (135 - overlap / 2));

                camExh.setAttribute('transform', `rotate(${(rotSign * aEx) % 360})`);
                camInt.setAttribute('transform', `rotate(${(rotSign * aIn) % 360})`);

                const lookupEx = isCW ? (-aEx) : aEx;
                const lookupIn = isCW ? (-aIn) : aIn;

                const liftEx = getFlatFollowerLift(parseFloat(exhDurEl.value), lookupEx - (180 - overlap / 2));
                const liftIn = getFlatFollowerLift(parseFloat(intDurEl.value), lookupIn - (180 + overlap / 2));
                const bVis = baseR - 35;

                exhValveAssembly.setAttribute('transform', `rotate(${-overlap / 2}) translate(0, ${liftEx + bVis})`);
                intValveAssembly.setAttribute('transform', `rotate(${overlap / 2}) translate(0, ${liftIn + bVis})`);

                const isLineArt = el('printMode').checked;
                if (el('intValveLightCanvas')) {
                    if (isLineArt) {
                        el('intValveLightCanvas').setAttribute('fill', liftIn > 0.001 ? '#000' : '#fff');
                        el('intValveLightCanvas').setAttribute('stroke', '#000');
                    } else {
                        el('intValveLightCanvas').setAttribute('fill', liftIn > 0.001 ? '#4aa3ff' : '#333');
                        el('intValveLightCanvas').setAttribute('stroke', '#2a3f66');
                    }
                }
                if (el('exhValveLightCanvas')) {
                    if (isLineArt) {
                        el('exhValveLightCanvas').setAttribute('fill', liftEx > 0.001 ? '#000' : '#fff');
                        el('exhValveLightCanvas').setAttribute('stroke', '#000');
                    } else {
                        el('exhValveLightCanvas').setAttribute('fill', liftEx > 0.001 ? '#e45b5b' : '#333');
                        el('exhValveLightCanvas').setAttribute('stroke', '#5b2a2a');
                    }
                }
                if (valveStatusLabel) {
                    if (liftIn > 0.001 && liftEx > 0.001) { valveStatusLabel.textContent = 'OVERLAP'; valveStatusLabel.style.color = '#f6e27a'; }
                    else if (liftIn > 0.001) { valveStatusLabel.textContent = 'INTAKE OPEN'; valveStatusLabel.style.color = '#4aa3ff'; }
                    else if (liftEx > 0.001) { valveStatusLabel.textContent = 'EXHAUST OPEN'; valveStatusLabel.style.color = '#e45b5b'; }
                    else { valveStatusLabel.textContent = 'ALL CLOSED'; valveStatusLabel.style.color = '#aaa'; }
                }
                updateLabels();

                requestAnimationFrame(step);
            }

            function getAngle(e) {
                const rect = jogDial.getBoundingClientRect();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                return Math.atan2(cy - (rect.top + rect.height / 2), cx - (rect.left + rect.width / 2)) * 180 / Math.PI;
            }
            const startH = e => { if (!autoRotateToggleEl.checked) { isDragging = true; lastMouseAngle = getAngle(e); if (e.cancelable) e.preventDefault(); } };
            const moveH = e => {
                if (isDragging) {
                    const curA = getAngle(e); let delta = curA - lastMouseAngle;
                    if (delta > 180) delta -= 360; if (delta < -180) delta += 360;

                    crankAngle = (crankAngle + delta + 720) % 720;

                    lastMouseAngle = curA;
                    if (e.cancelable) e.preventDefault();
                }
            };
            jogDial.addEventListener('mousedown', startH); window.addEventListener('mousemove', moveH); window.addEventListener('mouseup', () => isDragging = false);
            jogDial.addEventListener('touchstart', startH, { passive: false }); window.addEventListener('touchmove', moveH, { passive: false }); window.addEventListener('touchend', () => isDragging = false);

            el('crankAnglePlus10').onclick = () => {
                if (getDirMode() === 'cw') {
                    crankAngle = (crankAngle + 1) % 720;
                } else {
                    crankAngle = (crankAngle - 1 + 720) % 720;
                }
            };
            el('crankAngleMinus10').onclick = () => {
                if (getDirMode() === 'cw') {
                    crankAngle = (crankAngle - 1 + 720) % 720;
                } else {
                    crankAngle = (crankAngle + 1) % 720;
                }
            };
            autoRotateToggleEl.onchange = () => { el('crankAnglePlus10').disabled = el('crankAngleMinus10').disabled = autoRotateToggleEl.checked; };

            const inputs = ['rpm', 'ignAdv', 'camPhase', 'valveOverlap', 'camGap', 'intDuration', 'exhDuration'];
            inputs.forEach(id => el(id).addEventListener('input', updateCamShapes));

            el('camPhaseMinus').onclick = () => { camPhaseEl.value = parseFloat(camPhaseEl.value) - 1; updateCamShapes(); };
            el('camPhasePlus').onclick = () => { camPhaseEl.value = parseFloat(camPhaseEl.value) + 1; updateCamShapes(); };
            el('intakeCamPhaseMinus').onclick = () => { intakeCamPhase -= 1; updateLabels(); updateValveGraph(); };
            el('intakeCamPhasePlus').onclick = () => { intakeCamPhase += 1; updateLabels(); updateValveGraph(); };
            el('exhaustCamPhaseMinus').onclick = () => { exhaustCamPhase -= 1; updateLabels(); updateValveGraph(); };
            el('exhaustCamPhasePlus').onclick = () => { exhaustCamPhase += 1; updateLabels(); updateValveGraph(); };
            el('ignAdvMinus').onclick = () => { ignAdvEl.value--; updateLabels(); };
            el('ignAdvPlus').onclick = () => { ignAdvEl.value++; updateLabels(); };

            el('useAbbrNotation').onchange = updateValveGraph;
            el('rotationDirectionToggle').onchange = updateValveGraph;

            updateCamShapes(); requestAnimationFrame(step);
        })();
    </script>
</body>

</html>
